name: React Firebase CI/CD Pipeline

on:
  push:
    branches:
      - dev 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

   
